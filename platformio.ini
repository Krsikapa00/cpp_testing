[platformio]
default_envs = nucleo_f446re

; Firmware for the board: pio run, pio run -t upload
[env:nucleo_f446re]
platform = ststm32@20.0.0
platform_packages = platformio/toolchain-gccarmnoneeabi@1.70201.0
board = nucleo_f446re
framework = cmsis
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
extra_scripts = pre:scripts/build_flags.py
build_unflags = -std=gnu++14 -std=gnu++17
build_flags =
    -std=gnu++11
    -Wall -Wextra -Wpedantic -Wdouble-promotion
    ; The Nucleo's HSE input is 8 MHz. CMSIS assumes 25 MHz unless told otherwise.
    -DHSE_VALUE=8000000U

; Unit tests that run on the PC: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -Wall -Wextra -Wpedantic
